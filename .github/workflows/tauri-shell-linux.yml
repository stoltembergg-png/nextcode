name: tauri-shell-linux

# Builds the Linux x86_64 AppImage on ubuntu-24.04 and asserts the merge-gate
# payload: the bundle exists and, when extractable, carries opencode-cli-* and
# llama-server. Headed WebKit on GitHub-hosted runners is not required.
# See docs/superpowers/specs/2026-09-21-linux-desktop-design.md.

on:
  workflow_dispatch:
  push:
    branches: [tauri-shell, cursor/linux-desktop-plan-6cba, dev]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"
      - "packages/ui/**"
      - "packages/session-ui/**"
      - "packages/client/**"
      - "packages/identity/**"
      - "packages/opencode/**"
      - ".github/workflows/tauri-shell-linux.yml"

concurrency:
  group: tauri-shell-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Build the Linux sidecar
        working-directory: packages/opencode
        run: bun run build --skip-embed-web-ui --targets=opencode-linux-x64

      - uses: actions/upload-artifact@v6
        with:
          name: opencode-sidecar-linux
          path: packages/opencode/dist/

  shell:
    needs: sidecar
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install WebKitGTK (Linux)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Download the Linux sidecar
        uses: actions/download-artifact@v8
        with:
          name: opencode-sidecar-linux
          path: packages/opencode/dist

      - name: Stage the sidecar for externalBin
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p packages/desktop/src-tauri/binaries
          cp packages/opencode/dist/opencode-linux-x64/bin/opencode \
             "packages/desktop/src-tauri/binaries/opencode-cli-${TRIPLE}"
          chmod +x "packages/desktop/src-tauri/binaries/opencode-cli-${TRIPLE}"
          ls -l packages/desktop/src-tauri/binaries

      - name: Vendor the llama-server runtime
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          bun packages/opencode/script/fetch-semif-server.ts --target "$TRIPLE"

      - name: Build the renderer
        working-directory: packages/desktop
        run: bun run build:renderer-tauri

      - name: Build the AppImage
        working-directory: packages/desktop
        env:
          # linuxdeploy's bundled strip cannot parse Ubuntu 24.04 glibc/GTK
          # `.relr.dyn` (ELF type 0x13). linuxdeploy honors NO_STRIP.
          # See https://github.com/tauri-apps/tauri/issues/14796
          NO_STRIP: "true"
        run: bun run tauri build --config src-tauri/tauri.linux.conf.json --bundles appimage

      - name: Assert the AppImage payload
        run: |
          set -euo pipefail
          BUNDLE="packages/desktop/src-tauri/target/release/bundle/appimage"
          APPIMAGE=$(find "$BUNDLE" -maxdepth 1 -type f -name "*.AppImage" -print -quit)
          if [ -z "$APPIMAGE" ]; then
            echo "FAIL: no AppImage under $BUNDLE"
            ls -la "$BUNDLE" 2>/dev/null || true
            exit 1
          fi
          echo "appimage: $APPIMAGE"
          test -f "$APPIMAGE"

          chmod +x "$APPIMAGE"
          WORK=$(mktemp -d)
          cd "$WORK"
          set +e
          "$APPIMAGE" --appimage-extract >/extract.log 2>&1
          EXTRACT=$?
          set -e
          if [ "$EXTRACT" -ne 0 ] || [ ! -d squashfs-root ]; then
            echo "WARN: --appimage-extract failed; merge gate is the AppImage file existing"
            cat extract.log 2>/dev/null || true
            exit 0
          fi

          DESKTOP_BIN=$(find squashfs-root -type f -name "opencode-desktop" | head -1)
          if [ -z "$DESKTOP_BIN" ]; then
            echo "FAIL: opencode-desktop missing from extracted AppImage"
            find squashfs-root -maxdepth 4 -type f | head -80 || true
            exit 1
          fi
          test -x "$DESKTOP_BIN"

          CLI=$(find squashfs-root -type f -name "opencode-cli-*" | head -1)
          if [ -z "$CLI" ]; then
            echo "FAIL: opencode-cli-* missing from extracted AppImage"
            exit 1
          fi

          SERVER=$(find squashfs-root -type f -name "llama-server" | head -1)
          if [ -z "$SERVER" ]; then
            echo "FAIL: llama-server missing from extracted AppImage"
            exit 1
          fi
          echo "desktop: $DESKTOP_BIN"
          echo "sidecar: $CLI"
          echo "llama-server: $SERVER"

      - name: Upload AppImage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tauri-shell-linux-appimage
          path: packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
